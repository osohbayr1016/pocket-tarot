name: Security dependency lockfile upgrade
on:
  push:
    branches: [feat/offline-tarot-foundation]
    paths:
      - ".github/workflows/security-lock-upgrade.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade patched runtime dependencies
        working-directory: front-end
        run: |
          npm install --save-exact --legacy-peer-deps next@15.5.29 react@19.3.1 react-dom@19.3.1
          npm install --save-dev --save-exact --legacy-peer-deps eslint-config-next@15.5.29
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Commit resolved dependency lock
        run: |
          git add front-end/package.json front-end/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(deps): upgrade Next 15.5.29 and React 19.3.1"
          git push
